apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aeroscale-worker-scaledobject
  namespace: aeroscale
spec:
  scaleTargetRef:
    name: aeroscale-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: gcp-pubsub
      authenticationRef:
        name: keda-trigger-auth-gcp-pubsub
      metadata:
        subscriptionName: aeroscale-event-subscription
        mode: SubscriptionSize
        value: "50"